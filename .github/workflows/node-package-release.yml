name: node-package-release

on:
  push:
    tags:
      - "node-v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: node

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "node-v$package_version" || {
            echo "Release tag $RELEASE_TAG does not match package.json version $package_version."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Pack
        run: |
          package_version="$(node -p "require('./package.json').version")"
          archive_name="symphony-node-v$package_version.tgz"
          mkdir package-dist
          pnpm pack --pack-destination package-dist
          set -- package-dist/*.tgz
          test "$#" -eq 1 && test -f "$1"
          mv "$1" "package-dist/$archive_name"
          cd package-dist
          sha256sum "$archive_name" > "$archive_name.sha256"

      - name: Smoke test packed CLI
        run: |
          archive="$(find "$GITHUB_WORKSPACE/node/package-dist" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          bin_name="$(node -p "Object.keys(require('./package.json').bin)[0]")"
          test -n "$archive" && test -n "$bin_name"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          pnpm init
          pnpm add "$archive"
          pnpm exec "$bin_name" --help >/dev/null
          pnpm exec "$bin_name" --doctor "$GITHUB_WORKSPACE/node/WORKFLOW.md" > doctor.json
          node -e "const report = require('./doctor.json'); if (report.schemaVersion !== 1 || report.ok !== true) process.exit(1)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-package-${{ github.ref_name }}
          path: node/package-dist/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-package-${{ github.ref_name }}
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --verify-tag --generate-notes
          fi
